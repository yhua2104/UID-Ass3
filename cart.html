<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart – Pancake On The Rocks</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- PAGE TITLE -->
  <div class="cart-header">
    <h1 class="cart-header__title">Your Cart (3 items)</h1>
  </div>

  <main class="cart-main">

    <!-- CART ITEMS -->
    <div class="cart-section">
      <div class="cart-section__top">
        <span class="cart-section__label">Your Cart</span>
        <a href="Menu.html" class="cart-section__link">View Menu</a>
      </div>
    <!-- EMPTY CART -->
    <div class="cart-empty">
      <p class="cart-empty__text">Your cart is empty</p>
      <a href="Menu.html" class="btn btn--primary">Browse Menu</a>
    </div>

</div>


    <!-- ORDER SUMMARY -->
    <div class="order-summary">
      <div class="order-summary__header">
        <span class="order-summary__title">Order Summary</span>
        <span class="order-summary__time">45 mins</span>
      </div>

      <div class="order-summary__row">
        <span>Subtotal</span>
        <span id="summary-subtotal">$0.00</span>
      </div>
      <div class="order-summary__row">
        <span>Tax (GST 10%)</span>
        <span id="summary-tax">$0.00</span>
      </div>
      <div class="order-summary__row order-summary__row--total">
        <span>Estimated Total</span>
        <span id="summary-total">$0.00</span>
      </div>
    </div>

    <!-- PROCEED TO ORDER BUTTON -->
    <div class="cart-cta">
      <a href="checkout.html" class="btn btn--primary">PROCEED TO ORDER</a>
    </div>

  </main>

  
  <!--BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav__item bottom-nav__item--active">
      <span class="bottom-nav__icon">&#127968;</span>
      <span class="bottom-nav__label">Home</span>
    </a>
    <a href="Search.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#128269;</span>
      <span class="bottom-nav__label">Search</span>
    </a>
    <a href="Menu.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#127869;</span>
      <span class="bottom-nav__label">Menu</span>
    </a>
    <a href="cart.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#128722;</span>
      <span class="bottom-nav__label">Cart</span>
    </a>
    <a href="AI.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#129534;</span>
      <span class="bottom-nav__label">AI</span>
    </a>
  </nav>
  <script>
    // 从 localStorage 读取购物车数组
    const cart = JSON.parse(localStorage.getItem('cart')) || [];
    const cartEmpty = document.querySelector('.cart-empty');
    const cartSection = document.querySelector('.cart-section');
    const cartTitle = document.querySelector('.cart-header__title');

    // 购物车为空时显示空状态，否则渲染商品卡片
    if (cart.length === 0) {
      cartEmpty.style.display = '';
    } else {
      cartEmpty.style.display = 'none';
      cartTitle.textContent = `Your Cart (${cart.length} item${cart.length > 1 ? 's' : ''})`;

      cart.forEach((item, index) => {
        // 计算单件商品小计：(基础单价 + 配料加价总和) × 数量
        const extras = item.extras || [];
        const extrasTotal = extras.reduce((sum, e) => sum + e.price, 0);
        const itemSubtotal = (parseFloat(item.price) + extrasTotal) * item.quantity;

        const extrasHTML = extras.length > 0
          ? `<p class="cart-item__desc">${extras.map(e => `${e.name} +$${e.price.toFixed(2)}`).join(' · ')}</p>`
          : '';

        const card = document.createElement('div');
        card.className = 'cart-item';
        card.style.cursor = 'pointer';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.name}" class="cart-item__img" />
          <div class="cart-item__info">
            <div class="cart-item__top">
              <span class="cart-item__name">${item.name}</span>
              <span class="cart-item__price">$${itemSubtotal.toFixed(2)}</span>
            </div>
            ${extrasHTML}
            <span class="cart-item__qty">Qty: ${item.quantity}</span>
          </div>
          <button class="cart-item__delete" aria-label="Remove item">&#10005;</button>
        `;

        // 点击卡片跳转到对应商品详情页（需要 item.id 存在）
        if (item.id) {
          card.addEventListener('click', () => {
            window.location.href = `product.html?id=${item.id}`;
          });
        }

        // 点击删除按钮：阻止冒泡，从数组中移除该项并刷新页面
        card.querySelector('.cart-item__delete').addEventListener('click', (e) => {
          e.stopPropagation();
          cart.splice(index, 1);
          localStorage.setItem('cart', JSON.stringify(cart));
          location.reload();
        });

        cartSection.appendChild(card);
      });
    }

    // 计算 Order Summary：subtotal、GST 10%、预估总价
    const subtotal = cart.reduce((sum, item) => {
      const extras = item.extras || [];
      const extrasTotal = extras.reduce((eSum, e) => eSum + e.price, 0);
      return sum + (parseFloat(item.price) + extrasTotal) * item.quantity;
    }, 0);
    const tax = subtotal * 0.1;
    const total = subtotal + tax;

    document.getElementById('summary-subtotal').textContent = '$' + subtotal.toFixed(2);
    document.getElementById('summary-tax').textContent = '$' + tax.toFixed(2);
    document.getElementById('summary-total').textContent = '$' + total.toFixed(2);
  </script>


</body>
</html>
