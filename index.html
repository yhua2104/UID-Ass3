<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pancake On The Rocks</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  
  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="header__icon">&#8962;</a>
    <nav class="header__nav">
      <a href="#" class="header__icon">&#9776;</a>
      <a href="search.html" class="header__icon">&#128269;</a>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <main class="main">

    <section class="hero">
      <!-- Wishlist -->
      <button class="hero__wishlist" aria-label="Add to wishlist">&#9825;</button>


      <!-- Hero banner image -->
      <div class="hero__banner">
        <img src="img/Poster.svg" alt="Pancake On The Rocks huge poster" />
      </div>
    </section>

    <!-- CATEGORY TABS -->
    <section class="categories">
      <div class="categories__scroll">
        <button class="category-btn category-btn--active">🍩 Sweet</button>
        <button class="category-btn">🥚 Savory</button>
        <button class="category-btn">🍖 Ribs</button>
        <button class="category-btn">☕ Drinks</button>
      </div>
    </section>

    <!-- VIEW FULL MENU BUTTON -->
    <div class="menu-button">
      <a href="menu.html" class="btn btn--primary">VIEW FULL MENU</a>
    </div>

    <!-- FEATURED PRODUCTS GRID -->
    <section class="featured">
      <div class="product-grid">
        <a href="product.html?id=strawberry-pancakes" class="product-card">
          <img src="./img/strawberrypancake.png" alt="stawberry Pancakes" class="product-card__img" />
          <h3 class="product-card__name">Strawberry Pancakes</h3>
          <p class="product-card__price">$24.95</p>
        </a>
        

        <a href="product.html?id=chocolate-lava-cake" class="product-card">
          <img src="./img/chcolatelavacake.png" alt="Coffee Pancakes" class="product-card__img" />
          <h3 class="product-card__name">Chocolate Pancakes</h3>
          <p class="product-card__price">$9.95</p>
        </a>

        <a href="product.html?id=banana-pancake" class="product-card">
          <img src="./img/bananapancake.png" alt="Banana Pancakes" class="product-card__img" />
          <h3 class="product-card__name">Banana Pancakes</h3>
          <p class="product-card__price">$19.95</p>
        </a>

        <a href="product.html?id=coffee-pancake" class="product-card">
          <img src="./img/coffeepancake.png" alt="Coffee Pancakes" class="product-card__img" />
          <h3 class="product-card__name">Coffee Pancakes</h3>
          <p class="product-card__price">$5.95</p>
        </a>

      </div>
    </section>

  </main>

  <footer>
      <p class="hero__meta"><span class="hero__star">&#9733;</span> time: 24/7</p>
      <p class="hero__address">22 PLAYFAIR ST, THE ROCKS</p>
  </footer>

  <!--BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav__item bottom-nav__item--active">
      <span class="bottom-nav__icon">&#127968;</span>
      <span class="bottom-nav__label">Home</span>
    </a>
    <a href="search.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#128269;</span>
      <span class="bottom-nav__label">Search</span>
    </a>
    <a href="menu.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#127869;</span>
      <span class="bottom-nav__label">Menu</span>
    </a>
    <a href="cart.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#128722;</span>
      <span class="bottom-nav__label">Cart</span>
    </a>
    <a href="AI.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#129534;</span>
      <span class="bottom-nav__label">AI</span>
    </a>
  </nav>
  <script>
    document.querySelectorAll('.category-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('category-btn--active'));
        btn.classList.add('category-btn--active');
      });
    });
  </script>

</body>
</html>
