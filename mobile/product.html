<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product – Pancake On The Rocks</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- PRODUCT IMAGE -->
  <div class="product-hero">
    <img src="images/delicious-pancakes.jpg" alt="Product Image" class="product-hero__img" />
    <!-- Back button -->
    <a href="menu.html" class="product-hero__back">&#8592;</a>
  </div>

  <main class="product-detail">

    <!-- CATEGORY -->
    <p class="product-detail__category">Dessert</p>

    <!-- NAME & PRICE -->
    <h1 class="product-detail__name">Delicious Pancakes</h1>
    <p class="product-detail__price">$15</p>

    <!-- QUANTITY -->
    <div class="quantity-row">
      <span class="quantity-row__label">Quantity</span>
      <div class="quantity-row__controls">
        <button class="quantity-btn" id="decrease">&#8743;</button>
        <span class="quantity-row__number" id="quantity">1</span>
        <button class="quantity-btn" id="increase">&#8744;</button>
      </div>
    </div>

    <!-- ADD TO CART + WISHLIST -->
    <div class="cart-row">
      <button class="btn btn--primary cart-row__btn" id="add-to-cart">ADD TO CART</button>
      <button class="wishlist-btn" aria-label="Add to wishlist">&#9825;</button>
    </div>

    <!-- DESCRIPTION -->
    <p class="product-detail__desc">Chocolate pancakes, strawberries, cream, and chocolate ice cream.</p>
    <p class="product-detail__addon">Add chocolate sauce</p>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#8962;</span>
      <span class="bottom-nav__label">Home</span>
    </a>
    <a href="search.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#128269;</span>
      <span class="bottom-nav__label">Search</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#128276;</span>
      <span class="bottom-nav__label">Notifications</span>
    </a>
    <a href="#" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#128172;</span>
      <span class="bottom-nav__label">Messages</span>
    </a>
    <a href="cart.html" class="bottom-nav__item">
      <span class="bottom-nav__icon">&#128722;</span>
      <span class="bottom-nav__label">Cart</span>
    </a>
  </nav>

  <script src="js/cart.js"></script>
</body>
</html>
